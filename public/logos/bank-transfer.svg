<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 90" width="160" height="90">
  <!-- Rounded cyan container -->
  <rect x="3" y="3" width="154" height="84" rx="14" fill="#FFFFFF" stroke="#009fe3" stroke-width="4.5"/>
  
  <!-- "BANK" text with red stripes on 'B' -->
  <g id="bank-word">
    <!-- Red stripes on B -->
    <rect x="22" y="24" width="16" height="5" rx="2.5" fill="#e60000"/>
    <rect x="22" y="33" width="16" height="5" rx="2.5" fill="#e60000"/>
    <rect x="22" y="42" width="16" height="5" rx="2.5" fill="#e60000"/>
    
    <!-- B right loops & ANK text in cyan -->
    <text x="40" y="46" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#009fe3" letter-spacing="-0.5">BANK</text>
  </g>
  
  <!-- "TRANSFER" text underneath -->
  <text x="80" y="70" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="19" fill="#009fe3" text-anchor="middle" letter-spacing="1.5">TRANSFER</text>
</svg>
