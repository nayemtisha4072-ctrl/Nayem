<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" fill="none">
  <!-- Clean white strip background with rounded corners -->
  <rect width="1000" height="130" rx="16" fill="#FFFFFF"/>

  <!-- 1. BANK TRANSFER BADGE -->
  <g transform="translate(25, 20)">
    <rect x="0" y="0" width="160" height="90" rx="14" fill="#FFFFFF" stroke="#009fe3" stroke-width="4"/>
    <!-- Red stripes on B -->
    <rect x="20" y="24" width="15" height="5" rx="2.5" fill="#e60000"/>
    <rect x="20" y="33" width="15" height="5" rx="2.5" fill="#e60000"/>
    <rect x="20" y="42" width="15" height="5" rx="2.5" fill="#e60000"/>
    <text x="38" y="46" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="28" fill="#009fe3" letter-spacing="-0.5">BANK</text>
    <text x="80" y="70" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="19" fill="#009fe3" text-anchor="middle" letter-spacing="1.5">TRANSFER</text>
  </g>

  <!-- 2. bKash (বিকাশ) -->
  <g transform="translate(225, 25)">
    <!-- bKash bird box -->
    <rect x="110" y="10" width="60" height="60" rx="8" fill="#E2136E"/>
    <!-- Origami bird in white -->
    <path d="M 125 58 L 132 30 L 155 35 L 140 45 L 158 52 L 142 55 L 135 62 Z" fill="#FFFFFF"/>
    <path d="M 155 35 L 163 32 L 160 38 Z" fill="#FFFFFF"/>
    <!-- 'bKash' text -->
    <text x="5" y="55" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="44" fill="#E2136E">b<tspan fill="#4A4A4A">Kash</tspan></text>
  </g>

  <!-- 3. Nagad (নগদ) -->
  <g transform="translate(430, 22)">
    <!-- Circular flame swirl -->
    <g transform="translate(10, 5)">
      <circle cx="40" cy="40" r="36" fill="#F89D1C"/>
      <path d="M 40 8 A 32 32 0 0 1 72 40 A 32 32 0 0 1 40 72 A 32 32 0 0 1 18 63" fill="none" stroke="#ED1C24" stroke-width="12" stroke-linecap="round"/>
      <path d="M 40 18 A 22 22 0 0 1 62 40" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>
      <circle cx="40" cy="40" r="14" fill="#FFFFFF"/>
      <path d="M 32 20 L 52 14 L 46 32 Z" fill="#ED1C24"/>
    </g>
    <!-- 'নগদ' Bengali text in bold red -->
    <text x="105" y="60" font-family="'Kalpurush', 'SolaimanLipi', 'Noto Sans Bengali', Arial, sans-serif" font-weight="900" font-size="46" fill="#ED1C24" letter-spacing="1">নগদ</text>
  </g>

  <!-- 4. Rocket (রকেট - Dutch-Bangla Bank) -->
  <g transform="translate(670, 20)">
    <rect x="0" y="0" width="165" height="90" rx="6" fill="#8C3494"/>
    <!-- Tiny ROCKET in English -->
    <text x="55" y="32" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" letter-spacing="1.5">ROCKET</text>
    <!-- DBBL Paper Airplane icon -->
    <path d="M 125 14 L 152 26 L 118 42 L 128 30 Z" fill="#FFFFFF"/>
    <path d="M 128 30 L 140 33 L 132 38 Z" fill="#8C3494"/>
    <!-- 'রকেট' Bengali text -->
    <text x="82" y="64" font-family="'Kalpurush', 'SolaimanLipi', 'Noto Sans Bengali', Arial, sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" text-anchor="middle">রকেট</text>
    <!-- Subtitle: ডাচ-বাংলা ব্যাংক মোবাইল ব্যাংকিং -->
    <text x="82" y="78" font-family="'Kalpurush', 'SolaimanLipi', 'Noto Sans Bengali', Arial, sans-serif" font-weight="700" font-size="8.5" fill="#FFFFFF" text-anchor="middle">ডাচ্-বাংলা ব্যাংক মোবাইল ব্যাংকিং</text>
  </g>

  <!-- 5. Upay (উপায়) -->
  <g transform="translate(875, 20)">
    <!-- Yellow smile on left, blue on right -->
    <g transform="translate(25, 5)">
      <!-- Left yellow dot and smile arm -->
      <circle cx="10" cy="12" r="7" fill="#FFC900"/>
      <path d="M 10 25 C 10 50, 30 50, 35 50" fill="none" stroke="#FFC900" stroke-width="12" stroke-linecap="round"/>
      <!-- Right blue dot and smile arm -->
      <circle cx="60" cy="12" r="7" fill="#004A97"/>
      <path d="M 35 50 C 40 50, 60 50, 60 25" fill="none" stroke="#004A97" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- 'উপায়' Bengali text -->
    <text x="60" y="80" font-family="'Kalpurush', 'SolaimanLipi', 'Noto Sans Bengali', Arial, sans-serif" font-weight="900" font-size="20" fill="#004A97" text-anchor="middle" letter-spacing="1">উপায়</text>
  </g>
</svg>
